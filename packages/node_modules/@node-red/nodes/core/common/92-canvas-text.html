<script type="text/html" data-template-name="canvas-text">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]common.label.name">
    </div>
    <div class="form-row">
        <label for="node-input-property"><i class="fa fa-ellipsis-h"></i> Message property</label>
        <input type="text" id="node-input-property">
    </div>
    <div class="form-row">
        <label for="node-input-width"><i class="fa fa-arrows-h"></i> Width</label>
        <input type="number" id="node-input-width" min="160" max="1200" step="20" style="width:120px">
    </div>
    <div class="form-row">
        <label for="node-input-height"><i class="fa fa-arrows-v"></i> Height</label>
        <input type="number" id="node-input-height" min="80" max="900" step="20" style="width:120px">
    </div>
    <div class="form-row">
        <label for="node-input-maxLength"><i class="fa fa-scissors"></i> Max length</label>
        <input type="number" id="node-input-maxLength" min="0" step="1000" style="width:120px">
    </div>
    <div class="form-row">
        <label for="node-input-placeholder"><i class="fa fa-comment-o"></i> Placeholder</label>
        <input type="text" id="node-input-placeholder">
    </div>
</script>

<script type="text/html" data-help-name="canvas-text">
    <p>Displays a message property as live text inside this node on the workspace canvas.</p>
    <p>Set the property to <code>msg</code> or leave it blank to show the full message object.</p>
    <p>The node has no outputs. It is intended for passive visual taps where the Debug sidebar or Dashboard is not the right place to inspect large text payloads.</p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('canvas-text',{
        category: 'common',
        color: '#f8fafc',
        defaults: {
            name: { value: '' },
            property: { value: 'payload', required: true },
            width: { value: 520, validate: RED.validators.number() },
            height: { value: 260, validate: RED.validators.number() },
            maxLength: { value: 12000, validate: RED.validators.number() },
            placeholder: { value: 'waiting for text' }
        },
        inputs: 1,
        outputs: 0,
        icon: 'comment.svg',
        label: function() {
            return this.name || 'canvas text';
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        }
    });
</script>
